name: Publish Firefox Ghost UI v1.1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v1.1.0.yml'

permissions:
  contents: write

jobs:
  publish:
    if: github.repository == 'DekrovDev/firefox-ghost-ui'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test installer on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Installer.Tests.ps1

      - name: Test adaptive grips, geometry, installation and removal
        shell: powershell
        run: ./tests/Handles.Tests.ps1

      - name: Build ZIP and verify real packaged installation
        shell: powershell
        run: ./tests/Package.Tests.ps1

      - name: Verify checksums before publishing
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = './dist/firefox-ghost-ui-1.1.0-windows.zip'
          $checksums = './dist/SHA256SUMS.txt'
          if (!(Test-Path -LiteralPath $archive) -or !(Test-Path -LiteralPath $checksums)) {
            throw 'Release ZIP or checksum file is missing.'
          }
          $line = (Get-Content -LiteralPath $checksums -Raw).Trim()
          if ($line -notmatch '^([a-f0-9]{64})  firefox-ghost-ui-1\.1\.0-windows\.zip$') {
            throw 'Unexpected checksum file format.'
          }
          $actual = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $Matches[1]) { throw 'Release checksum mismatch.' }

      - name: Publish v1.1.0 as the latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $notes = @'
          Firefox Ghost UI v1.1.0 adds adaptive Windows window grips and off-screen recovery while preserving the existing floating Firefox toolbar.

          What's new:
          - Hover near a restored Firefox window edge to reveal an external grip and drag the window using native Windows movement.
          - Ctrl+Alt+F9 starts keyboard window movement; Ctrl+Alt+F10 returns a lost or off-screen window to the pointer's monitor.
          - A separate return capsule lets you recover a clipped or off-screen Firefox window, even after focus moves away.
          - The companion runs in the current Windows session, starts on sign-in, and does not inject code into websites or read browser content.
          - Includes updated documentation and a workaround guide for disappearing Extensions panels.

          Installation: download firefox-ghost-ui-1.1.0-windows.zip, extract the entire archive, and run Install.cmd. An existing installation can be upgraded with the same installer; it preserves the original backups.

          Validation: automated Windows PowerShell installer tests, adaptive-grip geometry and behavior tests, and a full installation/uninstallation test of the packaged archive. The companion executable is compiled locally from the included source during installation.

          SHA-256 checksums are provided in SHA256SUMS.txt.
          '@
          gh release create v1.1.0 './dist/firefox-ghost-ui-1.1.0-windows.zip' './dist/SHA256SUMS.txt' --target "$env:GITHUB_SHA" --title 'v1.1.0 — Adaptive window grips and recovery' --notes $notes --latest
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publishing failed.' }
