name: Installer checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: installer-checks-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate release tag and notes
        if: github.ref_type == 'tag'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = [IO.File]::ReadAllText((Join-Path $env:GITHUB_WORKSPACE 'VERSION')).Trim()
          if ($version -cnotmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Invalid VERSION.' }
          if ($env:GITHUB_REF -cne "refs/tags/v$version") { throw 'Tag must match VERSION.' }
          ./scripts/Write-ReleaseNotes.ps1
      - name: Prepare test evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force test-output | Out-Null
          "commit=$env:GITHUB_SHA`nrun=$env:GITHUB_RUN_ID`nattempt=$env:GITHUB_RUN_ATTEMPT`nevent=$env:GITHUB_EVENT_NAME" |
            Set-Content test-output/source.txt
          Get-Content test-output/source.txt
      - name: Windows PowerShell 5.1
        shell: powershell
        run: |
          Start-Transcript test-output/installer-ps51.txt
          try { ./tests/Installer.Tests.ps1 } finally { Stop-Transcript }
      - name: PowerShell 7
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          Start-Transcript test-output/installer-ps7.txt
          try { ./tests/Installer.Tests.ps1 } finally { Stop-Transcript }
      - name: English release summaries on PowerShell 5.1
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          Start-Transcript test-output/release-notes-ps51.txt
          try { ./tests/ReleaseNotes.Tests.ps1 } finally { Stop-Transcript }
      - name: English release summaries on PowerShell 7
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          Start-Transcript test-output/release-notes-ps7.txt
          try { ./tests/ReleaseNotes.Tests.ps1 } finally { Stop-Transcript }
      - name: Adaptive window grips
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          Start-Transcript test-output/handles.txt
          try { ./tests/Handles.Tests.ps1 } finally { Stop-Transcript }
      - name: Packaged installation
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          Start-Transcript test-output/package.txt
          try { ./tests/Package.Tests.ps1 } finally { Stop-Transcript }
      - name: Real update installer handoff
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          Start-Transcript test-output/update-handoff.txt
          try { ./tests/UpdateHandoff.Tests.ps1 } finally { Stop-Transcript }
      - name: Real release metadata over GitHub API
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          Start-Transcript test-output/update-metadata.txt
          try {
            $compiler = Join-Path $env:WINDIR 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
            & $compiler /nologo /codepage:65001 /target:exe /main:GhostUI.UpdateMetadataProbe /reference:System.Windows.Forms.dll /reference:System.Drawing.dll /reference:System.Core.dll /reference:System.Web.Extensions.dll /reference:System.IO.Compression.dll /out:test-output\UpdateMetadataProbe.exe companion\GhostHandles.cs companion\GhostUpdates.cs tests\UpdateMetadataProbe.cs
            if ($LASTEXITCODE -ne 0) { throw 'Update metadata probe compilation failed.' }
            .\test-output\UpdateMetadataProbe.exe
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Stop-Transcript }
      - name: Real Firefox update card
        if: ${{ !cancelled() }}
        shell: powershell
        run: |
          Start-Transcript test-output/update-browser.txt
          try { ./tests/UpdateBrowser.Tests.ps1 } finally { Stop-Transcript }
      - name: Test-driver process lifetime
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python ./tests/Toolbar.Tests.py --job-self-test 2>&1 | Tee-Object test-output/process-lifetime.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Development helper regression fixtures
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          python -m unittest discover -s devtools/firefox -p test_ghost_safety.py -v 2>&1 | Tee-Object test-output/helper-fixtures.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload test logs and diagnostics
        # Keep Windows/Linux evidence even when individual steps fail. Only
        # plain-text transcripts and source metadata are collected; retention
        # is bounded and no secrets or binaries are included.
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-test-logs
          if-no-files-found: warn
          retention-days: 3
          path: |
            test-output/source.txt
            test-output/installer-ps51.txt
            test-output/installer-ps7.txt
            test-output/release-notes-ps51.txt
            test-output/release-notes-ps7.txt
            test-output/handles.txt
            test-output/package.txt
            test-output/update-handoff.txt
            test-output/update-metadata.txt
            test-output/update-browser.txt
            test-output/process-lifetime.txt
            test-output/helper-fixtures.txt
      - name: Upload tested release package
        if: success() && github.ref_type == 'tag'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-package
          if-no-files-found: error
          retention-days: 1
          path: |
            dist/firefox-ghost-ui-*-windows.zip
            dist/SHA256SUMS.txt
            dist/RELEASE_NOTES.md
  linux:
    if: ${{ !cancelled() }}
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Portable helper regression fixtures
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-output
          printf 'commit=%s\nrun=%s\nattempt=%s\nevent=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_EVENT_NAME" > test-output/source.txt
          cat test-output/source.txt
          python3 -m unittest discover -s devtools/firefox -p test_ghost_safety.py -v 2>&1 | tee test-output/helper-fixtures.txt
      - name: Upload test logs and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-test-logs
          if-no-files-found: warn
          retention-days: 3
          path: |
            test-output/source.txt
            test-output/helper-fixtures.txt
