name: Installer checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Installer.Tests.ps1
      - name: PowerShell 7
        shell: pwsh
        run: ./tests/Installer.Tests.ps1
