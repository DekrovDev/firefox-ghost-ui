name: Installer checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Installer.Tests.ps1
      - name: PowerShell 7
        if: ${{ !cancelled() }}
        shell: pwsh
        run: ./tests/Installer.Tests.ps1
      - name: Adaptive window grips
        if: ${{ !cancelled() }}
        shell: powershell
        run: ./tests/Handles.Tests.ps1
      - name: Packaged installation
        if: ${{ !cancelled() }}
        shell: powershell
        run: ./tests/Package.Tests.ps1
      - name: Test-driver process lifetime
        if: ${{ !cancelled() }}
        shell: powershell
        run: python ./tests/Toolbar.Tests.py --job-self-test
      - name: Development helper regression fixtures
        if: ${{ !cancelled() }}
        shell: powershell
        run: python -m unittest discover -s devtools/firefox -p test_ghost_safety.py -v
